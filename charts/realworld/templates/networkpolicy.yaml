# Zero-trust within the namespace: deny everything, then open only the paths the
# tiers need. Enforced by the VPC CNI network policy agent (enabled in Terraform).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Web tier: reachable only from the ALB (its ENIs live in the VPC).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "realworld.selector" "ui" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: {{ required "vpcCidr is required" .Values.vpcCidr | quote }} }
      ports:
        - { protocol: TCP, port: {{ .Values.ui.port }} }
---
# App tier: from the ALB and Prometheus; out only to the data tier (Postgres, Valkey).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "realworld.selector" "api" | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: {{ .Values.vpcCidr | quote }} }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
  egress:
    - to:
        - ipBlock: { cidr: {{ .Values.vpcCidr | quote }} }
      ports:
        - { protocol: TCP, port: {{ .Values.database.port | int }} }
        - { protocol: TCP, port: 6379 }
