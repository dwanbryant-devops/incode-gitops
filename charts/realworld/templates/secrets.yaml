# All app secrets are materialised by External Secrets; nothing secret lives in Git.
# Expressions wrapped in backtick raw strings are ESO templates, passed through Helm untouched.

# Database: RDS-managed master secret -> DATABASE_URL (TLS required).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-database
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: api-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{`{{ .username | urlquery }}:{{ .password | urlquery }}`}}@{{ required "database.host is required" .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.secretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretArn | quote }}
        property: password
---
# JWT signing key: generated once in-cluster, never leaves Kubernetes.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: api-jwt
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-jwt
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: api-jwt
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JWT_SECRET: {{`"{{ .password }}"`}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: api-jwt
{{- if .Values.cache.secretArn }}
---
# Cache: Terraform-generated auth token -> REDIS_URL (TLS: rediss://).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-cache
  labels: {{- include "realworld.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: api-cache
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: {{`"rediss://:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/0"`}}
  dataFrom:
    - extract:
        key: {{ .Values.cache.secretArn | quote }}
{{- end }}
