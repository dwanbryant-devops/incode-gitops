# Default StorageClass. Every volume it creates is encrypted and tagged so the
# DLM snapshot policy in incode-platform (tag Backup=<project>-daily) picks it up.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
  tagSpecification_1: "Backup={{ .Values.project }}-daily"
  tagSpecification_2: "Project={{ .Values.project }}"
