# Default StorageClass. Every volume it creates is encrypted and tagged so the
# AWS Backup plan (tag Backup=daily + Project) picks it up automatically.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
  tagSpecification_1: "Backup=daily"
  tagSpecification_2: "Project={{ .Values.project }}"
