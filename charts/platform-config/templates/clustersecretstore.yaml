# Uses the External Secrets controller's own IRSA role, which can only read the
# specific Secrets Manager ARNs granted in Terraform (DB + cache).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  # Only these namespaces may pull through this store.
  conditions:
    - namespaces:
        {{- toYaml .Values.secretStoreNamespaces | nindent 8 }}
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
