apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "aws-load-balancer-controller-{{ .metadata.annotations.environment }}"
    spec:
      project: platform
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      sources:
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.5.0
          helm:
            releaseName: aws-load-balancer-controller
            valueFiles:
              - $values/values/addons/aws-load-balancer-controller.yaml
            valuesObject:
              clusterName: "{{ .metadata.annotations.cluster_name }}"
              region: "{{ .metadata.annotations.aws_region }}"
              vpcId: "{{ .metadata.annotations.vpc_id }}"
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: "{{ .metadata.annotations.aws_lb_controller_role_arn }}"
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
