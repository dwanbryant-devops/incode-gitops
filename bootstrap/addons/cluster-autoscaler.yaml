apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-autoscaler
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "cluster-autoscaler-{{ .metadata.annotations.environment }}"
    spec:
      project: platform
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      sources:
        - repoURL: https://kubernetes.github.io/autoscaler
          chart: cluster-autoscaler
          targetRevision: 9.59.0
          helm:
            releaseName: cluster-autoscaler
            valueFiles:
              - $values/values/addons/cluster-autoscaler.yaml
            valuesObject:
              awsRegion: "{{ .metadata.annotations.aws_region }}"
              autoDiscovery:
                clusterName: "{{ .metadata.annotations.cluster_name }}"
              rbac:
                serviceAccount:
                  annotations:
                    eks.amazonaws.com/role-arn: "{{ .metadata.annotations.cluster_autoscaler_role_arn }}"
        - repoURL: "{{ .metadata.annotations.gitops_repo_url }}"
          targetRevision: "{{ .metadata.annotations.gitops_revision }}"
          ref: values
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
