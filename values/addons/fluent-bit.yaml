# Ships container logs + kubelet journal to CloudWatch Logs.
#   namespace realworld  -> $LOG_GROUP_APP       (application tier)
#   everything else      -> $LOG_GROUP_PLATFORM  (add-ons, system, kubelet)
# RDS, ElastiCache, ALB, VPC flow logs and the EKS control plane ship to CloudWatch/S3
# natively (configured in Terraform), so every tier ends up in one place.
serviceAccount:
  create: true
  name: fluent-bit

tolerations:
  - operator: Exists

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

serviceMonitor:
  enabled: true

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Exclude_Path /var/log/containers/fluent-bit-*.log
        multiline.parser cri, docker
        Tag kube.*
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        DB /var/log/flb_kube.db

    [INPUT]
        Name systemd
        Tag host.kubelet
        Systemd_Filter _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Labels On
        Annotations Off

    # Route application-namespace records to their own tag (and log group).
    [FILTER]
        Name rewrite_tag
        Match kube.*
        Rule $kubernetes['namespace_name'] ^realworld$ app.$TAG false
        Emitter_Name app_emitter

  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match app.*
        region ${AWS_REGION}
        log_group_name ${LOG_GROUP_APP}
        log_stream_template $kubernetes['pod_name'].$kubernetes['container_name']
        log_stream_prefix fallback-
        auto_create_group false
        retry_limit 5

    [OUTPUT]
        Name cloudwatch_logs
        Match_Regex ^(kube|host)\..*
        region ${AWS_REGION}
        log_group_name ${LOG_GROUP_PLATFORM}
        log_stream_template $kubernetes['namespace_name'].$kubernetes['pod_name'].$kubernetes['container_name']
        log_stream_prefix node-
        auto_create_group false
        retry_limit 5
